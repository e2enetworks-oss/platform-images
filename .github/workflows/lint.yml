name: Quality

# Linters plus the unit tests for the build workflow's decision logic.
# Named for make/quality.mk, which carries the same set of targets.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: hadolint all Dockerfiles
        run: |
          status=0
          while IFS= read -r -d '' df; do
            echo ">> hadolint $df"
            docker run --rm -i ghcr.io/hadolint/hadolint:latest hadolint --failure-threshold error - < "$df" || status=1
          done < <(find . -name Dockerfile -not -path './.git/*' -print0)
          exit $status

      - name: actionlint all workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:latest

      - name: shellcheck all scripts
        run: docker run --rm -v "$PWD:/mnt" --workdir /mnt koalaman/shellcheck:stable scripts/*.sh

  # The build workflow decides what gets built by calling
  # scripts/build-matrix.sh. These tests are what stop a wrong decision —
  # a dropped image, a partial manifest — from reaching a publish.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats

      - name: Run unit tests
        run: make test-unit

  # The manifest merge only runs on a push to main, so a pull request never
  # exercises it. This job does: a local registry:2, a real buildx builder, and
  # the same push-by-digest → imagetools create sequence the publish path uses.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats

      - name: Run integration tests
        run: make test-integration
