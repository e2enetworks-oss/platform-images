name: Build & Publish

# Builds only the image directories that changed.
# - Pull requests: build both architectures, push nothing (proof before merge).
# - Push to main:  build + push <variant>-<sha7> and move <variant>-latest.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Detect which image directories changed ────────────────────────────
  # Filter keys encode the directory: segments joined with "_", dots as "_".
  #   python/3.14 → python_3_14 · bun/1 → bun_1 · infra-ci → infra-ci
  # Keep in sync with IMAGES in make/build.mk.
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python_3_11: python/3.11/**
            python_3_14: python/3.14/**
            rust: rust/**
            infra-ci: infra-ci/**
            pnpm_24: pnpm/24/**
            bun_1: bun/1/**

  # ── 2. Build (and on main, publish) each changed image ──────────────────
  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        key: ${{ fromJSON(needs.changes.outputs.images) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image name, directory and tags
        id: meta
        env:
          KEY: ${{ matrix.key }}
          SHA: ${{ github.sha }}
        run: |
          dir=$(echo "$KEY" | sed 's/_/\//' | sed 's/_/./g')
          name=${dir%%/*}
          rest=${dir#*/}
          [ "$rest" = "$dir" ] && rest=""
          sha7=${SHA::7}
          if [ -n "$rest" ]; then
            tags="ghcr.io/e2enetworks-oss/${name}:${rest}-${sha7}
          ghcr.io/e2enetworks-oss/${name}:${rest}-latest"
          else
            tags="ghcr.io/e2enetworks-oss/${name}:${sha7}
          ghcr.io/e2enetworks-oss/${name}:latest"
          fi
          {
            echo "dir=$dir"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "==> $dir"
          echo "$tags"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.dir }}
          file: ${{ steps.meta.outputs.dir }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.key }}
          cache-to: type=gha,mode=max,scope=${{ matrix.key }}
