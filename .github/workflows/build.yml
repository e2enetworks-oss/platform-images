name: Build & Publish

# Builds only the image directories that changed.
# - Push to main:      build, push an immutable tag, and move the latest tag.
# - workflow_dispatch on main: rebuild + publish a chosen list, or all.
# - Everything else (pull request, dispatch on any other branch): build both
#   architectures and warm the cache, publish nothing. Publishing is gated on
#   the ref rather than the event, because workflow_dispatch can name any ref
#   and moving <variant>-latest from an unreviewed branch is not recoverable
#   by reverting a commit.
#
# Two structural decisions carry the build time:
#
#   1. Each architecture builds on its own native runner — no QEMU emulation.
#      The per-arch builds push by digest only; a merge job then joins those
#      digests into one multi-arch manifest and applies the tags.
#
#   2. The layer cache lives in the registry, not in the Actions cache. Actions
#      caches are ref-scoped — a run reads its own ref and the default branch
#      and nothing else — so a pull request's cache is invisible to the merge
#      build that follows it, and every merge paid for a full cold rebuild. A
#      registry-backed cache has no such scoping: the pull request warms it and
#      the merge build imports it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      images:
        description: 'Image directories to rebuild, comma-separated (e.g. "rust,bun/1.4"), or "all"'
        required: true
        default: all

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: a cancelled run leaves the image it was publishing
  # unbuilt and its cache tag unwritten — that is how the bootstrap commit lost
  # its rust build. Pull request runs stay cancellable; a superseded push has
  # nothing worth finishing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io/e2enetworks-oss

jobs:
  # ── 1. Decide which image directories to build ───────────────────────────
  # The image set comes from `make list-dirs` (IMAGES in make/build.mk) — the
  # single source of truth. Path filters and the filter-key → directory map are
  # generated from it, so adding an image touches exactly one file.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # JSON array of {key, dir, name, variant}; [] when nothing changed.
      matrix: ${{ steps.matrix.outputs.matrix }}
      # Publishing is gated on the ref, not just the event. workflow_dispatch
      # can be launched against ANY branch, so an event-only gate would let a
      # feature branch push tags and move <variant>-latest — the tag consumers
      # treat as the current image. Everything off main builds without pushing.
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate path filters from the image set
        id: gen
        run: |
          set -euo pipefail
          dirs=$(make --no-print-directory list-dirs)
          {
            echo "filters<<EOF"
            printf '%s\n' "$dirs" | scripts/build-matrix.sh filters
            echo "EOF"
            echo "map=$(printf '%s\n' "$dirs" | scripts/build-matrix.sh map)"
          } >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: ${{ steps.gen.outputs.filters }}

      - name: Resolve build matrix
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          MAP: ${{ steps.gen.outputs.map }}
          CHANGED: ${{ steps.filter.outputs.changes }}
          REQUESTED: ${{ inputs.images }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            keys=$(make --no-print-directory list-dirs \
              | scripts/build-matrix.sh resolve-dirs "$REQUESTED" \
              | scripts/build-matrix.sh keys)
          else
            keys="$CHANGED"
          fi
          matrix=$(printf '%s\n' "$keys" | scripts/build-matrix.sh matrix "$MAP")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$matrix" \
            | jq -r 'if length == 0 then "no image directories changed"
                     else "building: " + (map(.dir) | join(", ")) end' \
            >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Reject secrets before building or publishing ──────────────────────
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Scan repository for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            zricethezav/gitleaks:v8.24.2@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 \
            dir . --redact --exit-code 1 --no-banner

  # ── 3. Build each image once per architecture, on a native runner ────────
  # When publishing, the layers are pushed by digest only — no tags; the merge
  # job applies those. Otherwise the build still runs on both architectures and
  # warms the cache, it just produces nothing.
  build:
    needs: [changes, gitleaks]
    if: needs.changes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.matrix) }}
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # A pull request from a fork gets a read-only token and cannot write the
      # cache tag. It still reads it — the packages are public.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build output and cache refs
        id: out
        env:
          PUBLISH: ${{ needs.changes.outputs.publish }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DIR: ${{ matrix.image.dir }}
          NAME: ${{ matrix.image.name }}
          KEY: ${{ matrix.image.key }}
          VARIANT: ${{ matrix.image.variant }}
          ARCH: ${{ matrix.platform.arch }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo="${REGISTRY}/${NAME}"
          # Variant directories tag as <variant>-<x>; bare directories as <x>.
          prefix=${VARIANT:+${VARIANT}-}
          cache_ref="${repo}:buildcache-${prefix}${ARCH}"
          version=$(scripts/build-matrix.sh image-version "$DIR")
          build_args=$(scripts/build-matrix.sh build-arg "$DIR" "$version")

          {
            scripts/build-matrix.sh build-output \
              "$PUBLISH" "$EVENT" "$repo" "$KEY" "$ARCH" "${SHA::7}"
            echo "build_args=${build_args}"
            echo "cache_from=type=registry,ref=${cache_ref}"
            if [ "$EVENT" != "pull_request" ] || [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
              echo "cache_to=type=registry,ref=${cache_ref},mode=max,image-manifest=true,oci-mediatypes=true"
            else
              echo "cache_to="
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.image.dir }} for linux/${{ matrix.platform.arch }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.dir }}
          file: ${{ matrix.image.dir }}/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          outputs: ${{ steps.out.outputs.spec }}
          build-args: ${{ steps.out.outputs.build_args }}
          pull: true
          # Skip the SLSA attestation manifests: they surface as unknown/unknown
          # entries in the registry and turn each per-arch push-by-digest result
          # into an index the manifest merge would then have to unwrap.
          provenance: false
          cache-from: ${{ steps.out.outputs.cache_from }}
          cache-to: ${{ steps.out.outputs.cache_to }}

      - name: Resolve Trivy image reference
        id: scan
        env:
          LOCAL_REF: ${{ steps.out.outputs.image_ref }}
          REPO: ${{ env.REGISTRY }}/${{ matrix.image.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -n "$LOCAL_REF" ]; then
            echo "image_ref=$LOCAL_REF" >> "$GITHUB_OUTPUT"
          elif [ -n "$DIGEST" ]; then
            echo "image_ref=${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::no image reference or digest available for Trivy" >&2
            exit 1
          fi

      - name: Report Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ steps.scan.outputs.image_ref }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: 0
          format: table

      - name: Block fixable Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ steps.scan.outputs.image_ref }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table

      - name: Export digest
        if: needs.changes.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.publish == 'true'
        with:
          name: digests-${{ matrix.image.key }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── 4. Join the per-arch digests into one tagged multi-arch manifest ─────
  # One job per image, and the job runs even when a sibling image's build
  # failed, so one broken Dockerfile cannot block the others from publishing.
  merge:
    needs: [changes, gitleaks, build]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.gitleaks.result == 'success' && needs.changes.outputs.publish == 'true' && needs.changes.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image.key }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        env:
          DIR: ${{ matrix.image.dir }}
          NAME: ${{ matrix.image.name }}
          VARIANT: ${{ matrix.image.variant }}
          SHA: ${{ github.sha }}
          DIGESTS: /tmp/digests
          # Must match the number of entries in the build job's platform matrix.
          # Without this a half-failed build would publish a single-arch image
          # under a tag consumers read as multi-arch.
          EXPECTED_ARCHES: 2
        run: |
          set -euo pipefail
          scripts/build-matrix.sh check-digests "$EXPECTED_ARCHES" "$DIGESTS"
          repo="${REGISTRY}/${NAME}"
          version=$(scripts/build-matrix.sh image-version "$DIR")
          if ! tags_output=$(scripts/build-matrix.sh tags "$repo" "$VARIANT" "${SHA::7}" "$version"); then
            exit 1
          fi
          mapfile -t tags <<< "$tags_output"
          if [ "${#tags[@]}" -ne 2 ] || [ -z "${tags[0]}" ] || [ -z "${tags[1]}" ]; then
            echo "::error::expected exactly two non-empty image tags" >&2
            exit 1
          fi
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          # Each artifact file is named for the digest its per-arch build pushed.
          mapfile -t sources < <(find "$DIGESTS" -type f -printf "${repo}@sha256:%f\n")
          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"
          echo "published \`${tags[0]}\` and \`${tags[1]}\`" >> "$GITHUB_STEP_SUMMARY"
